
name: PR Auto Label

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply label based on destination branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          MAPPING=$(cat .github/pr-label-mapping.json)

          LABEL=$(echo "$MAPPING" | jq -r \
            --arg branch "$BASE_BRANCH" '.[$branch] // empty')

          if [ -z "$LABEL" ]; then
            echo "No label mapping for branch: $BASE_BRANCH"
            exit 0
          fi

          # Clean up any outdated branch labels if the base branch was changed
          ALL_MAPPED_LABELS=$(echo "$MAPPING" | jq -r 'to_entries[].value')
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')

          for l in $CURRENT_LABELS; do
            if echo "$ALL_MAPPED_LABELS" | grep -Fxq "$l" && [ "$l" != "$LABEL" ]; then
              echo "Removing outdated branch label '$l'"
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$l" || true
            fi
          done

          gh api \
            --method POST \
            "repos/$REPO/issues/$PR_NUMBER/labels" \
            -f "labels[]=$LABEL"

          echo "Applied label '$LABEL' to PR #$PR_NUMBER"
